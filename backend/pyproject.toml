[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before app imports
"app/main.py" = ["E402"]
# long lines are inside LLM prompt strings
"app/graph/nodes.py" = ["E501"]
