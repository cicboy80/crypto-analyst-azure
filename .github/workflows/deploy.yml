name: Deploy to Azure

on:
  push:
    branches: [main]

env:
  ACR_NAME: hrchatbotregistry
  RESOURCE_GROUP: crypto-analyst-rg
  BACKEND_APP: crypto-analyst-backend
  FRONTEND_APP: crypto-analyst-frontend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and push backend image
        run: |
          docker build -t $ACR_NAME.azurecr.io/crypto-analyst-backend:${{ github.sha }} ./backend
          docker push $ACR_NAME.azurecr.io/crypto-analyst-backend:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t $ACR_NAME.azurecr.io/crypto-analyst-frontend:${{ github.sha }} ./frontend
          docker push $ACR_NAME.azurecr.io/crypto-analyst-frontend:${{ github.sha }}

      - name: Deploy backend Container App
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/crypto-analyst-backend:${{ github.sha }}

      - name: Deploy frontend Container App
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/crypto-analyst-frontend:${{ github.sha }}
